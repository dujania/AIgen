name: Publish to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - arena/cfc41448-aigen

permissions:
  contents: read
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Serve this branch's docs/ folder on GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" \
            -f build_type=legacy \
            -f source[branch]="${GITHUB_REF_NAME}" \
            -f source[path]=/docs
