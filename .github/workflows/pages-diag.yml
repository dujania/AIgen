name: Pages diagnostic
on:
  workflow_dispatch:
  push:
    branches:
      - arena/cfc41448-aigen

permissions:
  contents: write
  pages: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Pages API with the workflow token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "=== GET /pages ==="
            gh api --include "repos/${GITHUB_REPOSITORY}/pages" 2>&1 | head -40
            echo
            echo "=== PUT /pages (build_type=workflow) ==="
            gh api --include --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow 2>&1 | head -40
          } > pages-diag.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add pages-diag.txt
          git commit -m "chore: pages api diagnostic" || true
          git push || true
